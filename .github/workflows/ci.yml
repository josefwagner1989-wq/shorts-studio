name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: Build, test, offline selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev ffmpeg espeak-ng fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build everything (core, CLI, GTK app)
        run: ci/run.sh build cargo build --workspace --all-targets --message-format=short
      - name: Unit tests
        run: ci/run.sh tests cargo test --workspace
      - name: Clippy
        run: ci/run.sh clippy cargo clippy --workspace --all-targets --message-format=short -- -D warnings
        continue-on-error: true
      - name: End-to-end selftest (mock models → voice → render → outbox)
        run: |
          set -o pipefail
          ci/run.sh selftest cargo run -p shorts-cli -- selftest selftest-out | tee selftest.out
          tail -1 selftest.out > selftest.json
          echo "::notice title=selftest::$(cat selftest.json)"
          grep -q '"ok":true' selftest.json
      - name: Grab a frame for review
        if: always()
        run: |
          f=$(ls selftest-out/media/*/short.mp4 2>/dev/null | head -1)
          [ -n "$f" ] && ffmpeg -loglevel error -y -ss 4 -i "$f" -frames:v 1 -vf scale=360:-1 frame.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest.json
            frame.png
            selftest-out/media/*/short.mp4
            Cargo.lock
          if-no-files-found: ignore

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: shorts-studio.flatpak
          manifest-path: flatpak/io.github.shortsstudio.ShortsStudio.yml
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    name: Release with installer
    runs-on: ubuntu-24.04
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*x86_64*"
          merge-multiple: true
          path: dist
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cp scripts/install.sh dist/install.sh
          gh release create "${GITHUB_REF_NAME}" dist/*.flatpak dist/install.sh \
            --title "Shorts Studio ${GITHUB_REF_NAME}" --generate-notes --prerelease
