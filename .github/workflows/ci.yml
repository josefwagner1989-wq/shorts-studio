name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    name: Build, test, offline selftest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (cached between runs)
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libadwaita-1-dev ffmpeg espeak-ng fonts-dejavu-core
          version: "1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build everything (core, CLI, GTK app)
        run: ci/run.sh build cargo build --workspace --all-targets --message-format=short
      - name: Unit tests
        run: ci/run.sh tests cargo test --workspace
      - name: Clippy
        run: ci/run.sh clippy cargo clippy --workspace --all-targets --message-format=short -- -D warnings
        continue-on-error: true
      - name: End-to-end selftest (mock models → voice → render → outbox)
        run: |
          set -o pipefail
          ci/run.sh selftest cargo run -p shorts-cli -- selftest selftest-out | tee selftest.out
          tail -1 selftest.out > selftest.json
          echo "::notice title=selftest::$(cat selftest.json)"
          grep -q '"ok":true' selftest.json
      - name: End-to-end selftest, long video (outline → chapters → 16:9 render → chapters in description)
        run: |
          set -o pipefail
          ci/run.sh selftest-long cargo run -p shorts-cli -- selftest-long selftest-long-out | tee selftest-long.out
          tail -1 selftest-long.out > selftest-long.json
          echo "::notice title=selftest-long::$(cat selftest-long.json)"
          grep -q '"ok":true' selftest-long.json
      - name: Grab a frame for review
        if: always()
        run: |
          f=$(ls selftest-out/media/*/short.mp4 2>/dev/null | head -1)
          [ -n "$f" ] && ffmpeg -loglevel error -y -ss 4 -i "$f" -frames:v 1 -vf scale=360:-1 frame.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest.json
            frame.png
            selftest-out/media/*/short.mp4
            Cargo.lock
          if-no-files-found: ignore

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build the Flatpak (errors reported as annotations)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          ci/run.sh flatpak-builder flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub \
            --force-clean --repo=repo build flatpak/io.github.shortsstudio.ShortsStudio.yml
      - name: Make the installer bundle
        run: |
          ci/run.sh bundle flatpak build-bundle repo shorts-studio.flatpak io.github.shortsstudio.ShortsStudio \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la shorts-studio.flatpak
          echo "::notice title=flatpak::bundle $(du -h shorts-studio.flatpak | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-x86_64
          path: shorts-studio.flatpak

  release:
    name: Release with installer
    runs-on: ubuntu-24.04
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*x86_64*"
          merge-multiple: true
          path: dist
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cp scripts/install.sh dist/install.sh
          gh release create "${GITHUB_REF_NAME}" dist/*.flatpak dist/install.sh \
            --title "Shorts Studio ${GITHUB_REF_NAME}" --generate-notes --prerelease
