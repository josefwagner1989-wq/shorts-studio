[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]
# The GTK app needs GTK4/libadwaita dev libraries; build it explicitly
# (`cargo build -p shorts-studio`) or inside Flatpak. Everything else builds anywhere.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
shorts-core = { path = "crates/core" }
